<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your People &mdash; Train Your Brain Chess Academy</title>
<meta name="description" content="Find the table where the conversation feels easy and the challenge feels right.">
<style>
:root{
  --cream:#F6EADC;--cream-soft:#FBF4E9;--ink:#0B2B22;--ink-2:#123B2E;
  --gold:#C9A227;--gold-soft:#E8CE7E;--terracotta:#DC5D0E;--terracotta-soft:#f3b58c;
  --charcoal:#171310;--white:#FFFFFF;--line:rgba(23,19,16,0.12);
  --radius:18px;--radius-sm:10px;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.fyp-card{
  background:var(--white);border-radius:var(--radius);max-width:560px;width:100%;
  padding:44px 30px 34px;box-shadow:0 20px 50px -25px rgba(11,43,34,0.45);
  animation:fypIn .3s ease;
}
@keyframes fypIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.fyp-brand{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--terracotta);font-weight:700;margin-bottom:26px;text-transform:uppercase;}
.fyp-progress-track{height:4px;background:var(--line);border-radius:100px;overflow:hidden;margin-bottom:22px;}
.fyp-progress-fill{height:100%;background:var(--gold);transition:width .3s ease;}
.fyp-qnum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--terracotta);font-weight:700;margin-bottom:10px;}
.fyp-intro{font-family:var(--sans);font-style:italic;font-size:14.5px;color:var(--ink-2);margin-bottom:16px;}
.fyp-prompt{font-family:var(--serif);font-weight:700;font-size:24px;color:var(--ink);line-height:1.28;margin:0 0 6px;}
.fyp-sub{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);margin:0 0 18px;}
.fyp-cards{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.fyp-card-btn{
  text-align:left;font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--cream-soft);border:1.5px solid var(--line);border-radius:12px;
  padding:15px 18px;cursor:pointer;transition:border-color .15s ease,background .15s ease;
}
.fyp-card-btn:hover{border-color:var(--gold);}
.fyp-card-btn.active{background:var(--ink);border-color:var(--ink);color:var(--cream);}
.fyp-card-btn.active::after{content:" \2713";}
.fyp-continue{
  width:100%;margin-top:18px;padding:15px;font-family:var(--sans);font-weight:600;font-size:15px;
  background:var(--terracotta);color:var(--white);border:none;border-radius:100px;cursor:pointer;
}
.fyp-continue:disabled{opacity:.4;cursor:not-allowed;}
.fyp-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.fyp-back{background:none;border:none;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:6px 0;}
.fyp-form-row{margin-bottom:16px;}
.fyp-form-row label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:6px;}
.fyp-form-row input{
  width:100%;font-family:var(--sans);font-size:15px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--cream-soft);color:var(--ink);box-sizing:border-box;
}
.fyp-result{text-align:center;}
.fyp-result-icon{font-size:36px;color:var(--gold);margin-bottom:14px;}
.fyp-result-title{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--ink);margin-bottom:16px;}
.fyp-result-body{font-family:var(--sans);font-size:15px;color:var(--ink-2);line-height:1.6;margin-bottom:10px;}
.fyp-result-quote{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink);margin:20px 0 28px;}
.fyp-msg{font-family:var(--mono);font-size:12.5px;margin-top:12px;min-height:16px;text-align:center;}
@media(max-width:480px){.fyp-card{padding:56px 20px 26px;}.fyp-prompt{font-size:20px;}}
</style>
</head>
<body>
<div id="fypAdminBar"></div>
<div class="fyp-card" id="fypCard"></div>

<script>
// ============================================================
// FIND YOUR PEOPLE v2 — questions + scoring configuration
// Standalone page (find-your-people.html). NOT therapy, diagnosis,
// personality testing, or clinical CBT assessment. Rule-based only —
// no LLM/AI analyzes participants. Weights live here, isolated from
// UI code, so they can be rebalanced later without touching markup.
// ============================================================

const FYP_QUESTIONS = [
  {
    id: "age", section: "profile", prompt: "What is your age range?",
    options: ["21\u201329", "30\u201339", "40\u201349", "50\u201359", "60+"],
  },
  {
    id: "profession", section: "profile", prompt: "What world do you work or study in?",
    sub: "For group diversity and common interests only.",
    options: [
      "Medicine / Healthcare / Pharmacy", "Engineering / Architecture / Technology",
      "Law / Political Science / Finance", "Business / Entrepreneurship",
      "Psychology / Education / Academia", "Arts / Media / Creative", "Student", "Other",
    ],
  },
  {
    id: "language", section: "profile", prompt: "What language feels most natural socially?",
    options: ["Arabic", "English", "Arabic & English", "Other"],
  },
  {
    id: "interests", section: "profile", prompt: "Which conversations would you actually stay for?",
    sub: "Choose up to 3.", type: "multi", maxSelect: 3,
    options: [
      "Psychology & human behavior", "Business & entrepreneurship", "Travel & cultures",
      "Books / philosophy / ideas", "Technology & innovation", "Art / design / film",
      "Chess & strategy", "Relationships & communication", "Sport & wellbeing", "Other",
    ],
  },
  // ---------- CBT-informed situational section ----------
  {
    id: "q5", section: "situational", dimension: "socialApproach",
    intro: "Now for a few everyday situations. There are no right or wrong answers.",
    prompt: "You join a table and two people are already deeply engaged in conversation. What's your most likely reaction?",
    options: [
      { label: "I naturally join when there\u2019s an opening.", pts: 3, tier: "High" },
      { label: "I listen first and understand the dynamic.", pts: 3, tier: "High" },
      { label: "I prefer someone or an activity to bring me in.", pts: 2, tier: "Prefers structure" },
      { label: "I start wondering whether I belong there.", pts: 1, tier: "Prefers structure" },
    ],
  },
  {
    id: "q6", section: "situational", dimension: "recovery",
    prompt: "During a game, you make a decision that turns out badly. What sounds most like you?",
    options: [
      { label: "I laugh, adjust and keep going.", pts: 3, tier: "High" },
      { label: "I immediately try to understand what went wrong.", pts: 3, tier: "High" },
      { label: "It bothers me for a while, but I recover.", pts: 2, tier: "Moderate" },
      { label: "It affects how I approach the next few decisions.", pts: 1, tier: "Developing" },
    ],
  },
  {
    id: "q7", section: "situational", dimension: "flexibility",
    prompt: "Someone strongly challenges an opinion you believe in. What are you most likely to do?",
    options: [
      { label: "Get curious about why they see it differently.", pts: 3, tier: "High" },
      { label: "Explain my reasoning and listen to theirs.", pts: 3, tier: "High" },
      { label: "Defend my position strongly.", pts: 2, tier: "Moderate" },
      { label: "Prefer to move away from the disagreement.", pts: 1, tier: "Developing" },
    ],
  },
  {
    id: "q8", section: "situational", dimension: "challenge",
    prompt: "You are losing a strategy game. Which thought sounds closest to yours?",
    options: [
      { label: "\u201cLet\u2019s see if I can turn this around.\u201d", pts: 3, tier: "High" },
      { label: "\u201cWhat am I missing?\u201d", pts: 3, tier: "High" },
      { label: "\u201cI really hate losing, but I\u2019ll keep playing.\u201d", pts: 2, tier: "Moderate" },
      { label: "\u201cIt\u2019s only a game \u2014 I\u2019ll enjoy it anyway.\u201d", pts: 2, tier: "Moderate" },
    ],
  },
  {
    id: "q9", section: "situational", dimension: "reflection",
    prompt: "After an uncomfortable social interaction, what do you usually do?",
    options: [
      { label: "Think about what happened and what I could do differently.", pts: 3, tier: "High" },
      { label: "Consider both my perspective and theirs.", pts: 3, tier: "High" },
      { label: "Replay the situation in my mind for some time.", pts: 2, tier: "Moderate" },
      { label: "Move on without thinking much about it.", pts: 2, tier: "Moderate" },
    ],
  },
  {
    id: "q10", section: "situational", dimension: "awareness",
    prompt: "When something is clearly not working, which sounds most like you?",
    options: [
      { label: "I notice quickly and try another approach.", pts: 3, tier: "High" },
      { label: "I usually recognize it after some reflection.", pts: 2, tier: "Moderate" },
      { label: "I need time before I can change direction.", pts: 2, tier: "Developing" },
      { label: "I often realize it only after the situation is over.", pts: 1, tier: "Developing" },
    ],
  },
];

// Dimension -> display label for the internal CBT-informed profile.
const FYP_DIMENSION_LABELS = {
  reflection: "Reflective Thinking",
  flexibility: "Cognitive Flexibility",
  challenge: "Response to Challenge",
  socialApproach: "Social Approach",
  awareness: "Emotional Awareness",
  recovery: "Recovery After Mistakes",
  perspectiveOpenness: "Perspective Openness", // fed by q7 alongside flexibility
};

// Table-fit rules: each rule adds `weight` points to a category when its
// `test(answers)` returns true. Primary = highest total; Secondary = next
// highest, only if within FYP_SECONDARY_MARGIN points of the primary.
const FYP_SECONDARY_MARGIN = 2;
const FYP_TABLE_RULES = [
  { table: "OPEN / SPONTANEOUS", weight: 2, test: (a) => a.q5 === 0 || a.q5 === 1 },
  { table: "OPEN / SPONTANEOUS", weight: 2, test: (a) => a.q7 === 0 || a.q7 === 1 },
  { table: "GUIDED / ACTIVITY-LED", weight: 3, test: (a) => a.q5 === 2 || a.q5 === 3 },
  { table: "REFLECTIVE", weight: 2, test: (a) => a.q9 === 0 || a.q9 === 1 },
  { table: "REFLECTIVE", weight: 2, test: (a) => (a.interests || []).some((i) => i.includes("Psychology") || i.includes("philosophy")) },
  { table: "STRATEGY / CHALLENGE", weight: 2, test: (a) => a.q6 === 0 || a.q6 === 1 },
  { table: "STRATEGY / CHALLENGE", weight: 2, test: (a) => a.q8 === 0 || a.q8 === 1 },
  { table: "STRATEGY / CHALLENGE", weight: 2, test: (a) => (a.interests || []).some((i) => i.includes("Chess")) },
];


// Same backend used by the main site. Configure once, works for both.
const GOOGLE_APPS_SCRIPT_URL = ""; // e.g. "https://script.google.com/macros/s/XXXXXXXX/exec"

const urlParams = new URLSearchParams(window.location.search);
let fypEvent = urlParams.get("event") || "";
const isAdminView = urlParams.get("admin") === "1";

const fypState = { step: 0, answers: {} };
const TOTAL_Q = FYP_QUESTIONS.length;

function fypRender() {
  const card = document.getElementById("fypCard");
  if (fypState.step >= TOTAL_Q) { fypRenderContact(); return; }
  const q = FYP_QUESTIONS[fypState.step];
  const pct = Math.round((fypState.step / (TOTAL_Q + 1)) * 100);
  const isSituational = q.section === "situational";
  const existing = fypState.answers[q.id];

  let optsHtml = "";
  if (q.type === "multi") {
    const sel = existing || [];
    optsHtml = q.options.map((opt, i) => `
      <button type="button" class="fyp-card-btn ${sel.includes(i) ? "active" : ""}" onclick="fypToggleMulti('${q.id}',${i},${q.maxSelect || 99})">${opt}</button>`).join("");
    optsHtml += `<button type="button" class="fyp-continue" onclick="fypNext()">Continue &rarr;</button>`;
  } else if (isSituational) {
    optsHtml = q.options.map((opt, i) => `
      <button type="button" class="fyp-card-btn ${existing === i ? "active" : ""}" onclick="fypSelectSingle('${q.id}',${i})">${opt.label}</button>`).join("");
  } else {
    optsHtml = q.options.map((opt, i) => `
      <button type="button" class="fyp-card-btn ${existing === i ? "active" : ""}" onclick="fypSelectSingle('${q.id}',${i})">${opt}</button>`).join("");
  }

  card.innerHTML = `
    <div class="fyp-brand">Train Your Brain Chess Academy</div>
    <div class="fyp-progress-track"><div class="fyp-progress-fill" style="width:${pct}%"></div></div>
    <div class="fyp-qnum">QUESTION ${fypState.step + 1} OF ${TOTAL_Q}</div>
    ${q.intro ? `<p class="fyp-intro">${q.intro}</p>` : ""}
    <h1 class="fyp-prompt">${q.prompt}</h1>
    ${q.sub ? `<p class="fyp-sub">${q.sub}</p>` : ""}
    <div class="fyp-cards">${optsHtml}</div>
    <div class="fyp-nav">
      ${fypState.step > 0 ? `<button type="button" class="fyp-back" onclick="fypBack()">&larr; Back</button>` : "<span></span>"}
    </div>
  `;
}

window.fypSelectSingle = function (qid, idx) {
  fypState.answers[qid] = idx;
  fypRender();
  setTimeout(() => { fypState.step++; fypRender(); }, 200);
};

window.fypToggleMulti = function (qid, idx, max) {
  const cur = fypState.answers[qid] || [];
  const at = cur.indexOf(idx);
  if (at > -1) cur.splice(at, 1);
  else { if (cur.length >= max) return; cur.push(idx); }
  fypState.answers[qid] = cur;
  fypRender();
};
window.fypNext = function () { fypState.step++; fypRender(); };
window.fypBack = function () { fypState.step = Math.max(0, fypState.step - 1); fypRender(); };

function fypRenderContact() {
  const card = document.getElementById("fypCard");
  card.innerHTML = `
    <div class="fyp-brand">Train Your Brain Chess Academy</div>
    <div class="fyp-progress-track"><div class="fyp-progress-fill" style="width:95%"></div></div>
    <h1 class="fyp-prompt">One last move.</h1>
    <div class="fyp-form-row"><label>First Name *</label><input type="text" id="fypName"></div>
    <div class="fyp-form-row"><label>Email *</label><input type="email" id="fypEmail"></div>
    <div class="fyp-form-row"><label>WhatsApp (optional)</label><input type="text" id="fypWhatsapp"></div>
    <button type="button" class="fyp-continue" id="fypSubmitBtn" onclick="fypSubmit()">Submit &rarr;</button>
    <div class="fyp-msg" id="fypMsg"></div>
    <div class="fyp-nav"><button type="button" class="fyp-back" onclick="fypState.step--; fypRender();">&larr; Back</button></div>
  `;
}

// ---------- Scoring (client-side, rule-based, no AI) ----------
function fypComputeResults() {
  const a = fypState.answers;
  const situational = ["q5", "q6", "q7", "q8", "q9", "q10"];
  let raw = 0;
  const dims = {};
  situational.forEach((qid) => {
    const q = FYP_QUESTIONS.find((x) => x.id === qid);
    const opt = q.options[a[qid]];
    raw += opt.pts;
    dims[FYP_DIMENSION_LABELS[q.dimension]] = opt.tier;
  });
  dims[FYP_DIMENSION_LABELS.perspectiveOpenness] = dims[FYP_DIMENSION_LABELS.flexibility];
  const eventFitScore = Math.max(0, Math.min(100, Math.round(((raw - 6) / 12) * 100)));

  const answersForRules = {
    q5: a.q5, q6: a.q6, q7: a.q7, q8: a.q8, q9: a.q9, q10: a.q10,
    interests: (a.interests || []).map((i) => FYP_QUESTIONS.find((q) => q.id === "interests").options[i]),
  };
  const tableScores = {};
  FYP_TABLE_RULES.forEach((rule) => {
    if (rule.test(answersForRules)) tableScores[rule.table] = (tableScores[rule.table] || 0) + rule.weight;
  });
  const sorted = Object.entries(tableScores).sort((x, y) => y[1] - x[1]);
  const primary = sorted[0] ? sorted[0][0] : "OPEN / SPONTANEOUS";
  const secondary = sorted[1] && sorted[0][1] - sorted[1][1] <= FYP_SECONDARY_MARGIN ? sorted[1][0] : null;

  return { eventFitScore, dims, primary, secondary };
}

function fypAnswersReadable() {
  const a = fypState.answers;
  const out = {};
  FYP_QUESTIONS.forEach((q) => {
    if (q.type === "multi") {
      out[q.id] = (a[q.id] || []).map((i) => q.options[i]).join(", ");
    } else if (q.section === "situational") {
      out[q.id] = q.options[a[q.id]] ? q.options[a[q.id]].label : "";
    } else {
      out[q.id] = q.options[a[q.id]] || "";
    }
  });
  return out;
}

window.fypSubmit = async function () {
  const msgEl = document.getElementById("fypMsg");
  const btn = document.getElementById("fypSubmitBtn");
  const name = document.getElementById("fypName").value.trim();
  const email = document.getElementById("fypEmail").value.trim();
  const whatsapp = document.getElementById("fypWhatsapp").value.trim();

  if (!name || !email) {
    msgEl.style.color = "#8a3d0c";
    msgEl.textContent = "Name and email are required.";
    return;
  }
  if (!/^\S+@\S+\.\S+$/.test(email)) {
    msgEl.style.color = "#8a3d0c";
    msgEl.textContent = "Please enter a valid email address.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending\u2026";
  msgEl.textContent = "";

  const results = fypComputeResults();
  const answers = fypAnswersReadable();

  const payload = {
    action: "findYourPeople",
    event: fypEvent || "General Find Your People",
    name, email, whatsapp,
    age: answers.age, profession: answers.profession, language: answers.language, interests: answers.interests,
    eventFitScore: results.eventFitScore,
    primaryTable: results.primary,
    secondaryTable: results.secondary || "",
    dimensions: results.dims,
    answers,
    timestamp: new Date().toISOString(),
  };

  let success = true;
  if (GOOGLE_APPS_SCRIPT_URL) {
    try {
      const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload),
      });
      const data = await res.json();
      success = !!data.success;
    } catch (err) {
      success = false;
    }
  } else {
    console.log("[Find Your People \u2014 SIMULATED, no backend configured]", payload);
  }

  if (success) {
    fypRenderResult();
  } else {
    btn.disabled = false;
    btn.textContent = "Submit \u2192";
    msgEl.style.color = "#8a3d0c";
    msgEl.textContent = "Something went wrong \u2014 please try again.";
  }
};

function fypRenderResult() {
  const card = document.getElementById("fypCard");
  card.innerHTML = `
    <div class="fyp-result">
      <div class="fyp-result-icon">&#9813;</div>
      <h1 class="fyp-result-title">Your table is waiting.</h1>
      <p class="fyp-result-body">Thanks. Your answers will help us create the right mix of conversation, challenge and connection.</p>
      <p class="fyp-result-quote">&ldquo;Find the table where the conversation feels easy and the challenge feels right.&rdquo;</p>
      <a href="index.html#programs" class="fyp-continue" style="display:inline-block;text-decoration:none;box-sizing:border-box;">Continue to Booking &rarr;</a>
    </div>
  `;
}

function fypRenderEventPrompt() {
  const card = document.getElementById("fypCard");
  card.innerHTML = `
    <div class="fyp-brand">Train Your Brain Chess Academy</div>
    <h1 class="fyp-prompt">Which event are you joining?</h1>
    <p class="fyp-sub">This helps us group your answers with the right event.</p>
    <div class="fyp-form-row"><input type="text" id="fypEventInput" placeholder="e.g. Strategy Night \u2014 October"></div>
    <button type="button" class="fyp-continue" onclick="fypConfirmEvent()">Continue &rarr;</button>
  `;
}
window.fypConfirmEvent = function () {
  const val = document.getElementById("fypEventInput").value.trim();
  fypEvent = val || "General Find Your People";
  fypStart();
};

function fypRenderAdminBar() {
  if (!isAdminView) return "";
  return `
    <div style="max-width:560px;width:100%;margin:0 auto 14px;background:var(--ink);color:var(--cream);border-radius:12px;padding:14px 18px;font-family:var(--mono);font-size:12px;">
      <div style="opacity:.6;letter-spacing:.08em;margin-bottom:8px;">ADMIN \u2014 not visible to participants</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="fypAdminEventName" placeholder="event-name" style="flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:none;font-family:var(--mono);font-size:12px;">
        <button type="button" onclick="fypCopyAdminLink()" style="background:var(--terracotta);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:12px;cursor:pointer;">Copy Form Link</button>
      </div>
      <div id="fypAdminMsg" style="margin-top:8px;opacity:.8;min-height:14px;"></div>
    </div>
  `;
}
window.fypCopyAdminLink = function () {
  const base = window.location.origin + window.location.pathname;
  const name = document.getElementById("fypAdminEventName").value.trim();
  const url = name ? `${base}?event=${encodeURIComponent(name)}` : base;
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById("fypAdminMsg").textContent = "Copied: " + url;
  }).catch(() => {
    document.getElementById("fypAdminMsg").textContent = url + " (copy manually \u2014 clipboard blocked)";
  });
};

function fypStart() {
  document.getElementById("fypAdminBar").innerHTML = fypRenderAdminBar();
  fypRender();
}

document.getElementById("fypAdminBar").innerHTML = fypRenderAdminBar();
if (fypEvent) { fypStart(); } else { fypRenderEventPrompt(); }
</script>
</body>
</html>
